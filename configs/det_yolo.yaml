# Detection config, pre-declared before any test-split evaluation.
#
# max_det is the reason this file exists at this point in the project rather than later.
# Ultralytics defaults to max_det=300. Measured on D2's 252 unique frames, 8 carry more
# than 300 boxes (max 584), and 3 of those 8 land in the test split under the sortie
# assignment in configs/d2.yaml. At the default, those frames would be silently
# truncated and per-image panel-count error would be wrong in the headline eval with no
# error message anywhere.
#
# 1000 was not enough either, measured: at conf 0.001 the 584-box val frame returned
# exactly 1000 detections, so its low-score tail was cut. At 3000 the same checkpoint
# returns 1257 on that frame (no frame reaches the cap), 13 more true positives at IoU
# 0.5, and val AP@0.5 (101-point) goes from 0.973185 to 0.974546, AP@0.5:0.95 from
# 0.824685 to 0.824860; the counts at conf 0.1 and above do not change. The test split's
# densest frame has 512 boxes, so at 1000 its AP could be cut the same way.

data: configs/d2.yaml
model: yolov8n.pt

# Train
epochs: 100
batch: 16
imgsz: 640
seed: 0
patience: 20
device: 0

# Augmentation — Ultralytics 8.4.129's defaults, written out unchanged so the training
# run is fully declared here rather than inherited from whatever version is installed.
# Classification-only (auto_augment, erasing) and segmentation-only (copy_paste) keys
# are left out. D2 frames are greyscale replicated across RGB, so hue and saturation
# jitter change nothing (a grey pixel has saturation 0) and only hsv_v acts.
hsv_h: 0.015       # hue fraction
hsv_s: 0.7         # saturation fraction
hsv_v: 0.4         # value (brightness) fraction
degrees: 0.0       # rotation, +/- degrees
translate: 0.1     # translation, +/- fraction
scale: 0.5         # scale gain, +/-
shear: 0.0         # +/- degrees
perspective: 0.0
flipud: 0.0        # vertical flip probability
fliplr: 0.5        # horizontal flip probability
bgr: 0.0           # channel swap probability
mosaic: 1.0        # mosaic probability
close_mosaic: 10   # mosaic off for the final 10 epochs
mixup: 0.0
cutmix: 0.0

# Inference / eval — applies to val, test and predict alike.
max_det: 3000
conf: 0.001    # low, so the PR curve is not truncated before AP is computed
iou: 0.7       # NMS IoU; swept 0.3-0.8 on val and kept, as declared (docs/EXPERIMENTS.md)

# The operating confidence: the threshold at which detections are counted as panels.
# Chosen on val by the declared rule (lowest panel-count MAE on the grid 0.05-0.95, the
# lower confidence on a tie) from the val evaluation det_val_20261022T163802Z of the
# selected model, run det_oppoint_20261022T193813Z. conf above stays 0.001: AP needs the
# whole precision-recall curve.
conf_operating: 0.25

# The checkpoint the single test evaluation may read. The tuning pass (configs/
# det_tuning.yaml) kept the baseline, yolov8n.pt with hsv_v 0.4, i.e. this file's model
# and augmentation; the model taken forward is its seed 0 run, det_20261022T163213Z.
# The checkpoint is not in git, so its SHA-256 pins it: scripts/eval_test_det.py
# refuses any best.pt with another hash.
checkpoint_sha256: 1bd7908cc646b5a4b0af5eaa23bd69cbc97b7a593af9c459cc19f71f9419976a
