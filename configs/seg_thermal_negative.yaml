# The PV01 U-Net on D2 thermal frames, unchanged: a transfer check, declared before it
# runs. Nothing here is tuned, and the result is reported whichever way it falls.
#
# Frames: D2 **val** only (configs/d2.yaml's val, sortie 2, 51 frames). D2 test was
# evaluated once for detection and is not read.
split: val

# The model and its threshold, as in configs/seg_eval.yaml.
run: runs/seg_unet_20261023T145359Z
checkpoint: best.pt
checkpoint_sha256: 9a2653125d19df6c0883c8c6e0dacfcb42d651738558ae6c710bbfeae0bb8724
threshold: 0.5       # sigmoid > 0.5, i.e. logit > 0
amp: true
batch_size: 8

# Input: the greyscale frame replicated to three channels (D2's three channels are
# already byte-identical), scaled to [0, 1] and standardised with the PV01 train
# per-channel mean and std stored in the checkpoint. Padded (zeros after
# standardisation, bottom and right) to a multiple of 16 if needed; 640 x 512 already
# is one, and the script reports whether padding happened. No fine-tuning.

# D2 has boxes, not masks. The reference is a **filled-box mask**: a pixel is positive
# when its centre lies inside any ground-truth box. It approximates the panel area: it
# includes the gaps a box spans and, where boxes of a diagonal row overlap, background
# between panels. Per frame and pooled over the val frames (pixel counts summed):
# - predicted positive fraction;
# - filled-box coverage (the positive fraction of the filled-box mask);
# - IoU of the prediction with the filled-box mask;
# - the fraction of predicted positives outside every box.
metrics: [predicted_fraction, box_coverage, box_mask_iou, predicted_outside_boxes]

# Overlays: the first, middle ((n - 1) // 2) and last val frame by file name. Frame |
# filled boxes | prediction coloured against the filled boxes, in seg_eval.yaml's colours.
overlays: [first, middle, last]
